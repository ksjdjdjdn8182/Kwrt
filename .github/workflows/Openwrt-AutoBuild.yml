#=================================================
# 基于kiddin9上游精简，仅编译x86_64，移除所有GitHub API查询，解决限流报错
#=================================================
name: Build OpenWrt x86_64

# 手动页面一键运行
on: 
  workflow_dispatch:
    inputs:
      nocache:
        description: 清空缓存完整重编
        type: boolean
        default: false
      ssh:
        description: 开启SSH远程调试
        type: boolean
        default: false

env:
  TZ: Asia/Shanghai
  TARGET: "x86_64"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build x86_64
    
    steps:
    - name: Checkout 仓库代码
      uses: actions/checkout@main
      with:
          fetch-depth: 0

    - name: 加载全局&机型配置
      run: |
        source "${{ github.workspace }}/devices/common/settings.ini"
        if [ -f "devices/${{ env.TARGET }}/settings.ini" ]; then
          source "${{ github.workspace }}/devices/${{ env.TARGET }}/settings.ini"
        fi
        echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
        echo "REPO_BRANCH=${REPO_BRANCH}" >> $GITHUB_ENV
        echo "CONFIG_FILE=${CONFIG_FILE}" >> $GITHUB_ENV
        echo "DIY_SH=${DIY_SH}" >> $GITHUB_ENV
        echo "FREE_UP_DISK=${FREE_UP_DISK}" >> $GITHUB_ENV
        echo "UPLOAD_FIRMWARE_FOR_ARTIFACT=true" >> $GITHUB_ENV

    - name: 深度清理磁盘空间（解决编译空间不足）
      uses: coder-xiaomo/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
        llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
        libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "Asia/Shanghai"
        git config --global user.email "actions@github.com"
        git config --global user.name "Github Actions"

    # 核心修复：固定分支拉取源码，彻底删除GraphQL API查询代码
    - name: 拉取OpenWrt源码（固定25.12稳定分支，无API请求）
      run: |
        git clone https://github.com/openwrt/openwrt -b openwrt-25.12 openwrt

    - name: 挂载外置分区缓存编译目录
      run: |
        sudo mkdir -p -m 777 /mnt/openwrt/build_dir openwrt/staging_dir
        ln -sf /mnt/openwrt/build_dir openwrt/build_dir
        sudo ln -sf openwrt/staging_dir /mnt/openwrt/staging_dir

    - name: 加载自定义配置、分层执行diy脚本
      run: |
        function git_clone_path() {
          trap 'rm -rf "$tmpdir"' EXIT
          branch="$1" rurl="$2" mv="$3"
          [[ "$mv" != "mv" ]] && shift 2 || shift 3
          rootdir="$PWD"
          tmpdir="$(mktemp -d)" || exit 1
          if [ ${#branch} -lt 10 ]; then
          git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
          cd "$tmpdir"
          else
          git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
          cd "$tmpdir"
          git checkout $branch
          fi
          if [ "$?" != 0 ]; then
            echo "error on $rurl"
            exit 1
          fi
          git sparse-checkout init --cone
          git sparse-checkout set $@
          [[ "$mv" != "mv" ]] && cp -rn ./* $rootdir/ || mv -n $@/* $rootdir/$@/
          cd $rootdir
        }
        export -f git_clone_path
        mkdir -p openwrt
        cp -rf devices/common/. openwrt/
        cp -rf devices/${{ env.TARGET }}/. openwrt/
        cp -rf devices openwrt/
        cd openwrt
        chmod +x devices/common/$DIY_SH

        # ========== 新增调试代码：打印所有sed行号 + 命令追踪 ==========
        echo "===================== [调试] common/diy.sh 全部sed命令行号 ====================="
        grep -n "sed -i" devices/common/$DIY_SH
        echo "======================================================================================"
        echo "===================== [调试] x86_64/diy.sh 全部sed命令行号 ====================="
        grep -n "sed -i" devices/${{ env.TARGET }}/$DIY_SH
        echo "======================================================================================"

        # 开启shell命令追踪，执行公共diy脚本
        set -x
        /bin/bash "devices/common/$DIY_SH"
        set +x
        # ======================================================================================

        cp -f devices/common/$CONFIG_FILE .config
        if [ -f "devices/${{ env.TARGET }}/$CONFIG_FILE" ]; then
          echo >> .config
          cat devices/${{ env.TARGET }}/$CONFIG_FILE >> .config
        fi
        if [ -f "devices/${{ env.TARGET }}/$DIY_SH" ]; then
          chmod +x devices/${{ env.TARGET }}/$DIY_SH
          # 机型脚本同样开启追踪
          set -x
          /bin/bash "devices/${{ env.TARGET }}/$DIY_SH"
          set +x
        fi

    - name: 批量自动应用补丁
      run: |
        cd openwrt
        cp -rn devices/common/patches devices/${{ env.TARGET }}/
        if [ -n "$(ls -A devices/${{ env.TARGET }}/*.bin.patch 2>/dev/null)" ]; then
          git apply devices/${{ env.TARGET }}/patches/*.bin.patch
        fi
        find "devices/${{ env.TARGET }}/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' -R --no-backup-if-mismatch -p1 -F 1 -i '%'"
        find "devices/${{ env.TARGET }}/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' --no-backup-if-mismatch -p1 -F 1 -i '%'"

    - name: Defconfig 同步配置
      run: |
        cd openwrt
        make defconfig
        cat .config

    - name: 编译缓存加速
      uses: stupidloud/cachewrtbuild@main
      with:
        ccache: 'false'
        mixkey: ${{ env.TARGET }}
        clean: ${{ github.event.inputs.nocache }}
        prefix: ${{ github.workspace }}/openwrt

    - name: SSH远程调试（可选开启）
      uses: kiddin9/debugger-action@master
      if: github.event.inputs.ssh == true

    - name: 编译固件（失败自动输出完整日志）
      id: compile
      run: |
        shopt -s extglob
        df -hT
        cd openwrt
        echo -e "$(($(nproc)+1)) 线程编译"
        make -j$(($(nproc)+1)) || { log=$(mktemp);make V=s &>$log; tail -50 $log;df -hT;exit 1; }
        df -hT

    - name: 整理固件文件
      id: organize
      continue-on-error: true
      run: |
        shopt -s extglob
        cd openwrt/bin/targets/*/*/
        cp $GITHUB_WORKSPACE/openwrt/.config ${{ env.TARGET }}.config || true
        echo "EMOJI=🚀" >> $GITHUB_ENV

    - name: 上传固件至Artifact（编译产物下载）
      uses: actions/upload-artifact@main
      with:
        name: OpenWrt_x86_64_固件
        path: |
          openwrt/bin/targets/
