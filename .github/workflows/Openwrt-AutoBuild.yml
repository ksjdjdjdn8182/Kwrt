name: OpenWrt Kwrt AutoBuild x86_64
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      CLEAN_CACHE:
        description: 编译前清空全部缓存（完整重新编译）
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 安装全套编译依赖
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext git gperf libncurses-dev libssl-dev libxml-parser-perl lzma make memstat mtools ninja-build p7zip-full patch pkgconf python3 python3-pip python3-setuptools rsync scons squashfs-tools subversion swig texinfo unzip wget xsltproc xz-utils zlib1g-dev

      - name: 拉取 OpenWrt 25.12 官方源码 + kiddin9插件源码源
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout openwrt-25.12
          echo "src-git kiddin9 https://github.com/kiddin9/openwrt-packages.git;openwrt-25.12" >> feeds.conf.default

      - name: 复制仓库内自定义配置、补丁、diy脚本
        run: |
          cd openwrt
          mkdir -p ./target/linux/x86_64
          cp -r ../devices/x86_64/* ./target/linux/x86_64/
          cd target/linux/x86_64
          chmod +x diy.sh

      # 容错补丁执行，失败自动跳过不中断编译
      - name: 批量应用所有补丁文件
        run: |
          cd openwrt/target/linux/x86_64
          for patch in patches/*.patch; do
            echo "正在应用补丁：$patch"
            patch -p1 --ignore-errors < $patch || true
          done

      - name: 缓存编译依赖，加速多次构建
        uses: actions/cache@v3
        with:
          path: |
            openwrt/build_dir
            openwrt/staging_dir
            openwrt/dl
            ~/.ccache
          key: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ github.workflow }}-${{ github.ref }}

      - name: 可选：清空全部缓存完整重编
        if: github.event.inputs.CLEAN_CACHE == true
        run: |
          cd openwrt
          rm -rf build_dir staging_dir dl tmp .config

      - name: 更新并安装全部插件源 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 执行 diy.sh 生成纯净无冲突 .config
        run: |
          cd openwrt/target/linux/x86_64
          ./diy.sh

      - name: 多线程编译固件
        run: |
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee build_log.txt

      - name: 上传编译日志
        uses: actions/upload-artifact@v4
        with:
          name: Kwrt-编译日志
          path: openwrt/build_log.txt

      - name: 上传生成固件镜像
        uses: actions/upload-artifact@v4
        with:
          name: Kwrt-x86_64-固件镜像
          path: openwrt/bin/targets/x86/64/
